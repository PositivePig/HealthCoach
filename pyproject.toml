[project]
name = "healthcoach-agent"
version = "0.1.0"
description = "Proactive multimodal health coach agent with multi-agent collaboration, MCP servers and long-term memory"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "jasonjpjia" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",
    # Settings & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # LLM / Agent
    "langgraph>=0.2.50,<0.3",
    "langchain-core>=0.3.20",
    "openai>=1.55.0",          # DeepSeek / Qwen / generic OpenAI-compatible
    "anthropic>=0.39.0",       # Claude (optional)
    "httpx>=0.27.0",
    # Observability
    "langfuse>=2.55.0",
    # Utils
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    # Storage (W2+: no-docker dev profile, see ADR/0006)
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "qdrant-client[fastembed]>=1.12.0",
    # MCP (W2)
    "mcp>=1.1.0",
    # Scheduler (W2 D3)
    "apscheduler>=3.10.4",
    # RAG (W3): BM25 baseline; dense (qdrant-client + fastembed) already in deps
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    # Chart generation (W4 D2)
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
