# HealthCoachAgent W1 dependencies
# Postgres + TimescaleDB + Qdrant + Langfuse
# Usage: docker compose up -d
# Stop:  docker compose down
# Reset: docker compose down -v   (删 volume，清数据)

services:

  # ---------- Postgres + TimescaleDB ----------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: hc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthcoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthcoach_dev}
      POSTGRES_DB: ${POSTGRES_DB:-healthcoach}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthcoach}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Qdrant ----------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hc_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Langfuse (self-hosted, observability) ----------
  langfuse_db:
    image: postgres:16-alpine
    container_name: hc_langfuse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_dev
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    container_name: hc_langfuse
    restart: unless-stopped
    depends_on:
      langfuse_db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_dev@langfuse_db:5432/langfuse
      NEXTAUTH_SECRET: please-change-this-secret-in-prod
      SALT: please-change-this-salt-in-prod
      NEXTAUTH_URL: http://localhost:3001
      TELEMETRY_ENABLED: "false"
      LANGFUSE_DEFAULT_PROJECT_ID: healthcoach
      AUTH_DISABLE_SIGNUP: "false"

volumes:
  postgres_data:
  qdrant_data:
  langfuse_db_data:
